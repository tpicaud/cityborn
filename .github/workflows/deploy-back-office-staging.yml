name: Deploy Staging Back Office to Vercel

on:
  push:
    branches:
      - staging
    paths:
      - 'apps/back-office/**'
      - 'packages/types/**'
      - 'package/errors/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }} --cwd=apps/back-office

      - name: Build Project
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }} --cwd=apps/back-office

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} --cwd=apps/back-office
