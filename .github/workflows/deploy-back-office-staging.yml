name: Deploy Staging Frontend to Vercel

on:
  push:
    branches:
      - staging
    paths:
      - 'apps/back-office/**'
      - 'packages/types/**'
      - 'packages/errors/**'

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build back office
        run: pnpm build:back-office

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }} --cwd=apps/back-office
        env:
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_BACK_OFFICE_PROJECT_ID: ${{ secrets.VERCEL_BACK_OFFICE_PROJECT_ID }}

      - name: Build for Vercel (prebuilt)
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }} --cwd=apps/back-office
        env:
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_BACK_OFFICE_PROJECT_ID: ${{ secrets.VERCEL_BACK_OFFICE_PROJECT_ID }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --yes --token=${{ secrets.VERCEL_TOKEN }} --cwd=apps/back-office
        env:
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_BACK_OFFICE_PROJECT_ID: ${{ secrets.VERCEL_BACK_OFFICE_PROJECT_ID }}