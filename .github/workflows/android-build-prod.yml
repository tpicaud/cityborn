name: Build Production Android App

on:
  push:
    branches:
      - master
    paths:
      - 'apps/mobile/**'
      - 'packages/types/**'
      - 'package/errors/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Mobile - Production
    env:
      APP_VARIANT: ${{ vars.APP_VARIANT }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      EXPO_PUBLIC_REST_BACKEND_URL: ${{vars.EXPO_PUBLIC_REST_BACKEND_URL}}
      EXPO_PUBLIC_WEBSOCKET_BACKEND_URL: ${{vars.EXPO_PUBLIC_WEBSOCKET_BACKEND_URL}}
      EXPO_PUBLIC_GOOGLE_CLIENT_ID: ${{vars.EXPO_PUBLIC_GOOGLE_CLIENT_ID}}

    steps:
      - name: Delete unnecessary tools folder
        run: rm -rf /opt/hostedtoolcache

      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4.0.2
        with:
          node-version: 20.x

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Cache pnpm store
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install

      - name: Syncing app version code
        working-directory: apps/mobile
        run: eas build:version:sync --platform android --profile production

      - name: Build Android app
        working-directory: apps/mobile
        run: eas build --platform android --profile production --local --output ${{ github.workspace }}/cityborn-production-release.aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ github.workspace }}/cityborn-production-release.aab

      - name: Submit
        working-directory: apps/mobile
        run: eas submit --platform android --profile production --non-interactive --path ${{ github.workspace }}/cityborn-production-release.aab
