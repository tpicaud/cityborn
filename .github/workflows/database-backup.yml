name: Database backup

on:
  workflow_dispatch:
  push:
    branches:
      - 56-gestion-des-backup-de-la-base-de-données
    paths:
      - .github/workflows/database-backup.yml

permissions: {}

concurrency:
  group: database-backup-dev
  cancel-in-progress: false

jobs:
  test-b2-connectivity:
    name: Test Backblaze B2 connectivity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate configuration
        env:
          B2_UPLOAD_KEY_ID: ${{ secrets.B2_DEV_UPLOAD_KEY_ID }}
          B2_UPLOAD_APPLICATION_KEY: ${{ secrets.B2_DEV_UPLOAD_APPLICATION_KEY }}
          B2_VERIFY_KEY_ID: ${{ secrets.B2_DEV_VERIFY_KEY_ID }}
          B2_VERIFY_APPLICATION_KEY: ${{ secrets.B2_DEV_VERIFY_APPLICATION_KEY }}
          B2_BUCKET: ${{ vars.B2_DEV_BUCKET_NAME }}
          B2_ENDPOINT: ${{ vars.B2_DEV_ENDPOINT }}
          B2_REGION: ${{ vars.B2_DEV_REGION }}
          B2_PREFIX: ${{ vars.B2_DEV_PREFIX }}
        run: |
          set -euo pipefail

          required_names=(
            B2_UPLOAD_KEY_ID
            B2_UPLOAD_APPLICATION_KEY
            B2_VERIFY_KEY_ID
            B2_VERIFY_APPLICATION_KEY
            B2_BUCKET
            B2_ENDPOINT
            B2_REGION
            B2_PREFIX
          )

          for name in "${required_names[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is not configured"
              exit 1
            fi
          done

          aws --version

      - name: Upload connectivity file
        id: upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_DEV_UPLOAD_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_DEV_UPLOAD_APPLICATION_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.B2_DEV_REGION }}
          AWS_REGION: ${{ vars.B2_DEV_REGION }}
          B2_BUCKET: ${{ vars.B2_DEV_BUCKET_NAME }}
          B2_ENDPOINT: ${{ vars.B2_DEV_ENDPOINT }}
          B2_PREFIX: ${{ vars.B2_DEV_PREFIX }}
        run: |
          set -euo pipefail

          file_path="$RUNNER_TEMP/cityborn-b2-connectivity.txt"
          object_key="${B2_PREFIX}/connectivity/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"

          printf 'cityborn-b2-connectivity\nrun-id=%s\n' "$GITHUB_RUN_ID" > "$file_path"

          sha256="$(sha256sum "$file_path" | cut -d ' ' -f 1)"

          aws s3api put-object \
            --bucket "$B2_BUCKET" \
            --key "$object_key" \
            --body "$file_path" \
            --endpoint-url "$B2_ENDPOINT" \
            > /dev/null

          echo "object_key=$object_key" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Verify connectivity file
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_DEV_VERIFY_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_DEV_VERIFY_APPLICATION_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.B2_DEV_REGION }}
          AWS_REGION: ${{ vars.B2_DEV_REGION }}
          B2_BUCKET: ${{ vars.B2_DEV_BUCKET_NAME }}
          B2_ENDPOINT: ${{ vars.B2_DEV_ENDPOINT }}
          OBJECT_KEY: ${{ steps.upload.outputs.object_key }}
          EXPECTED_SHA256: ${{ steps.upload.outputs.sha256 }}
        run: |
          set -euo pipefail

          downloaded_path="$RUNNER_TEMP/cityborn-b2-connectivity-downloaded.txt"

          aws s3api head-object \
            --bucket "$B2_BUCKET" \
            --key "$OBJECT_KEY" \
            --endpoint-url "$B2_ENDPOINT" \
            > /dev/null

          aws s3api get-object \
            --bucket "$B2_BUCKET" \
            --key "$OBJECT_KEY" \
            --endpoint-url "$B2_ENDPOINT" \
            "$downloaded_path" \
            > /dev/null

          actual_sha256="$(sha256sum "$downloaded_path" | cut -d ' ' -f 1)"

          if [[ "$actual_sha256" != "$EXPECTED_SHA256" ]]; then
            echo "::error::The downloaded file checksum does not match"
            exit 1
          fi

          {
            echo "### Backblaze B2 connectivity"
            echo
            echo "- Status: successful"
            echo "- Object: \`$OBJECT_KEY\`"
            echo "- SHA-256: verified"
          } >> "$GITHUB_STEP_SUMMARY"
