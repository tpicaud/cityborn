name: Deploy Staging Backend to Railway

on:
  workflow_dispatch:
  workflow_call:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        run: railway up --service=${{ secrets.RAILWAY_BACKEND_SERVICE_ID }} --environment=staging --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}