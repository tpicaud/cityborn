name: Release - Mobile - Prod

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Type of release to create"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  bump-version:
    name: Bump Mobile Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      lastMobileTag: ${{ steps.last_mobile_tag.outputs.lastMobileTag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Bump Expo version
        id: version
        run: |
          node <<'EOF'
          const fs = require('fs');

          const releaseType = '${{ inputs.release_type }}';

          const filePath = 'apps/mobile/app.config.js';
          const content = fs.readFileSync(filePath, 'utf8');

          const match = content.match(/version:\s*['"](\d+)\.(\d+)\.(\d+)['"]/);

          if (!match) {
            throw new Error('Version not found in app.config.js');
          }

          let [, major, minor, patch] = match;

          major = Number(major);
          minor = Number(minor);
          patch = Number(patch);

          switch (releaseType) {
            case 'major':
              major++;
              minor = 0;
              patch = 0;
              break;

            case 'minor':
              minor++;
              patch = 0;
              break;

            case 'patch':
            default:
              patch++;
              break;
          }

          const newVersion = `${major}.${minor}.${patch}`;

          const updated = content.replace(
            /version:\s*['"](\d+)\.(\d+)\.(\d+)['"]/,
            `version: '${newVersion}'`
          );

          fs.writeFileSync(filePath, updated);

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `version=${newVersion}\n`
          );

          console.log(`Updated version to ${newVersion}`);
          EOF

      - name: Commit version bump
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .
          git commit -m "chore: release v${{ steps.version.outputs.version }}"

      - name: Push changes
        run: |
          git push origin HEAD

      - name: Find last mobile release tag
        id: last_mobile_tag
        uses: actions/github-script@v8
        with:
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const last = releases.find(r => r.tag_name.startsWith('mobile-v'));
            core.setOutput('lastMobileTag', last?.tag_name ?? '');

  build-ios:
    name: Build iOS
    needs: [bump-version]
    uses: ./.github/workflows/build-ios.yml
    secrets: inherit
    with:
      environment: production
      profile: production

  build-android:
    name: Build Android
    needs: [bump-version]
    uses: ./.github/workflows/build-android.yml
    secrets: inherit
    with:
      environment: production
      profile: production

  submit-ios:
    name: Submit iOS
    needs:
      - build-ios
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/deploy-to-expo.yml
    secrets: inherit
    with:
      environment: production
      platform: ios
      profile: production
      artifact_name: ${{ needs.build-ios.outputs.ipa_artifact_name }}

  submit-android:
    name: Submit Android
    needs:
      - build-android
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/deploy-to-expo.yml
    secrets: inherit
    with:
      environment: production
      platform: android
      profile: production
      artifact_name: ${{ needs.build-android.outputs.apk_artifact_name }}

  create-release:
    name: Release
    needs:
      - bump-version
      - submit-ios
      - submit-android
    if: ${{ !failure() && !cancelled() }}
    permissions:
      contents: write
    uses: ./.github/workflows/generate-release.yml
    with:
      releaseTag: mobile-v${{ needs.bump-version.outputs.version }}
      previousTag: ${{ needs.bump-version.outputs.lastMobileTag }}
      filterPaths: apps/mobile, packages
      prereleaseTagToDelete: mobile-pre-release
      prerelease: false

  notify-discord:
    name: Notify Discord (Prod release)
    needs: [bump-version, create-release]
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord
        uses: actions/github-script@v8
        env:
          DISCORD_WEBHOOK_URL_PROD_NOTIF: ${{ secrets.DISCORD_WEBHOOK_URL_PROD_NOTIF }}
          PR_LIST: ${{ needs.create-release.outputs.prList }}
        with:
          script: |
            const webhookUrl = process.env.DISCORD_WEBHOOK_URL_PROD_NOTIF;
            if (!webhookUrl) {
              console.log('DISCORD_WEBHOOK_URL_PROD_NOTIF is not set, skipping notification.');
              return;
            }

            const prs = JSON.parse(process.env.PR_LIST);
            if (prs.length === 0) {
              console.log('No PR in this release, skipping notification.');
              return;
            }

            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            const releaseTag = 'mobile-v${{ needs.bump-version.outputs.version }}';

            await fetch(webhookUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                embeds: [{
                  title: `🟩 Mobile — ${releaseTag} déployé en production`,
                  url: `https://github.com/${owner}/${repo}/releases/tag/${releaseTag}`,
                  description: prs.map(pr => `- [${pr.title}](${pr.url}) (#${pr.number})`).join('\n'),
                  color: 0x57f287,
                }],
              }),
            });
