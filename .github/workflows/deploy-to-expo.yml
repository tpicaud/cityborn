name: Deploy to Expo

on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: string
      platform:
        required: true
        type: string
      profile:
        required: true
        type: string
      artifact_name:
        required: true
        type: string

  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      platform:
        required: true
        type: string
      profile:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
    secrets:
      EXPO_TOKEN:
        required: true

jobs:
  submit:
    name: Submit app
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Download bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}

      - name: Submit
        working-directory: apps/mobile
        env:
          APP_VARIANT: ${{ vars.APP_VARIANT }}
          GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
          GOOGLE_MAPS_IOS_API_KEY: ${{ secrets.GOOGLE_MAPS_IOS_API_KEY }}
        run: eas submit --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive --path ${{ github.workspace }}/${{ inputs.artifact_name }} --no-wait
