name: Version API on merge

on:
  pull_request:
    types: [closed]

concurrency:
  group: version-api-on-merge
  cancel-in-progress: false

jobs:
  version-openapi-doc:
    name: Version OpenAPI doc
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Detect API changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            apiHasChanged:
              - 'packages/api/**'

      - name: Setup node
        if: steps.filter.outputs.apiHasChanged == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install pnpm
        if: steps.filter.outputs.apiHasChanged == 'true'
        run: npm install -g pnpm

      - name: Cache pnpm store
        if: steps.filter.outputs.apiHasChanged == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.filter.outputs.apiHasChanged == 'true'
        run: pnpm install

      - name: Generate OpenAPI doc
        if: steps.filter.outputs.apiHasChanged == 'true'
        id: generate
        run: pnpm --dir packages/api generate:openapi -- ${{ github.run_number }}

      - name: Commit versioned doc
        if: steps.filter.outputs.apiHasChanged == 'true' && steps.generate.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add packages/api/openapi/
          git commit -m "chore(api): version openapi doc api-v${{ github.run_number }} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
