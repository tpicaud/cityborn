name: Android Staging Build

on:
  push:
    branches:
      - feature/expo-app_test-workflow
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v3

      - name: 🏗 Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20.x

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 🧰 Setup pnpm
        uses: pnpm/action-setup@v3

      - name: 📦 Install dependencies
        run: pnpm install

      - name: 🚀 Build app
        working-directory: apps/mobile
        run: eas build --platform android --profile staging --non-interactive --auto-submit
