name: Continuous Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  version:
    name: Version
    uses: ./.github/workflows/generate-version-number.yml

  tag:
    name: Tag
    needs: version
    permissions:
      contents: write
    uses: ./.github/workflows/create-tag.yml
    with:
      tag: ${{ needs.version.outputs.version }}

  create-wip-pre-release:
    name: Pre-release
    needs:
      - version
      - tag
    permissions:
      contents: write
    uses: ./.github/workflows/generate-release.yml
    with:
      releaseTag: ${{ needs.version.outputs.version_rc }}
      prerelease: true

  detect-changes:
    name: Detect changes
    needs: version
    uses: ./.github/workflows/detect-changes.yml

  build-staging:
    name: Build staging
    needs:
      - tag
      - detect-changes
    secrets: inherit
    uses: ./.github/workflows/build-staging.yml
    with:
      backendHasChanged: ${{ needs.detect-changes.outputs.backendHasChanged }}
      frontendHasChanged: ${{ needs.detect-changes.outputs.frontendHasChanged }}
      backofficeHasChanged: ${{ needs.detect-changes.outputs.backofficeHasChanged }}
      mobileHasChanged: ${{ needs.detect-changes.outputs.mobileHasChanged }}

  deploy-staging:
    name: Deploy staging
    needs:
      - build-staging
      - detect-changes
    secrets: inherit
    uses: ./.github/workflows/deploy-staging.yml
    with:
      backendHasChanged: ${{ needs.detect-changes.outputs.backendHasChanged }}
      frontendHasChanged: ${{ needs.detect-changes.outputs.frontendHasChanged }}
      backofficeHasChanged: ${{ needs.detect-changes.outputs.backofficeHasChanged }}
      mobileHasChanged: ${{ needs.detect-changes.outputs.mobileHasChanged }}

  approve-prod:
    name: Approve prod
    environment: manual-approval
    runs-on: ubuntu-latest
    needs:
      - deploy-staging
    steps:
      - run: echo "Approved"

  build-prod:
    name: Build prod
    needs:
      - approve-prod
      - detect-changes
    secrets: inherit
    uses: ./.github/workflows/build-prod.yml
    with:
      backendHasChanged: ${{ needs.detect-changes.outputs.backendHasChanged }}
      frontendHasChanged: ${{ needs.detect-changes.outputs.frontendHasChanged }}
      backofficeHasChanged: ${{ needs.detect-changes.outputs.backofficeHasChanged }}
      mobileHasChanged: ${{ needs.detect-changes.outputs.mobileHasChanged }}

  deploy-prod:
    name: Deploy prod
    needs:
      - build-prod
      - approve-prod
      - detect-changes
    secrets: inherit
    uses: ./.github/workflows/deploy-prod.yml
    with:
      ipaArtifactName: ${{ needs.build-prod.outputs.ipa_artifact_name }}
      apkArtifactName: ${{ needs.build-prod.outputs.apk_artifact_name }}
      backendHasChanged: ${{ needs.detect-changes.outputs.backendHasChanged }}
      frontendHasChanged: ${{ needs.detect-changes.outputs.frontendHasChanged }}
      backofficeHasChanged: ${{ needs.detect-changes.outputs.backofficeHasChanged }}
      mobileHasChanged: ${{ needs.detect-changes.outputs.mobileHasChanged }}

  create-release:
    name: Release
    needs:
      - version
      - tag
    permissions:
      contents: write
    uses: ./.github/workflows/generate-release.yml
    with:
      releaseTag: ${{ needs.version.outputs.version }}
      prerelease: false