name: Deploy Staging

on:
  workflow_call:
    inputs:
      backendHasChanged:
        type: string
        required: true
      frontendHasChanged:
        type: string
        required: true
      backofficeHasChanged:
        type: string
        required: true
      mobileHasChanged:
        type: string
        required: true

jobs:
  frontend:
    name: Deploy Frontend
    if: ${{ inputs.frontendHasChanged == 'true' }}
    uses: ./.github/workflows/deploy-to-vercel.yml
    secrets: inherit
    with:
      environment: staging
      project_id: ${{ vars.VERCEL_FRONTEND_PROJECT_ID }}

  back-office:
    name: Deploy Back Office
    if: ${{ inputs.backofficeHasChanged == 'true' }}
    uses: ./.github/workflows/deploy-to-vercel.yml
    secrets: inherit
    with:
      environment: staging
      project_id: ${{ vars.VERCEL_BACK_OFFICE_PROJECT_ID }}

  backend:
    name: Deploy Backend
    if: ${{ inputs.backendHasChanged == 'true' }}
    uses: ./.github/workflows/deploy-to-railway.yml
    secrets: inherit
    with:
      environment: staging
      service_id: ${{ vars.RAILWAY_BACKEND_SERVICE_ID }}

  submit-ios:
    name: Submit iOS
    if: ${{ inputs.mobileHasChanged == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Submit ios
        run: echo "✅ Nothing to submit"

  submit-android:
    name: Submit Android
    if: ${{ inputs.mobileHasChanged == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Submit Android
        run: echo "✅ Nothing to submit"