name: Deploy to Axiom

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment whose dashboards to deploy: staging or production'
        required: true
        type: string
    secrets:
      AXIOM_DASHBOARDS_TOKEN:
        required: true

jobs:
  deploy:
    name: Deploy Axiom dashboards
    runs-on: ubuntu-latest
    concurrency:
      group: axiom-dashboards-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install

      - name: Deploy dashboards
        run: node scripts/axiom-dashboards.mts deploy "$ENVIRONMENT"
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          AXIOM_DASHBOARDS_TOKEN: ${{ secrets.AXIOM_DASHBOARDS_TOKEN }}
