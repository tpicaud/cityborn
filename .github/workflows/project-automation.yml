name: Link issue on PR creation

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write
  contents: read

jobs:
  add-closes-keyword:
    runs-on: ubuntu-latest
    steps:
      - name: Add Closes
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const branch = pr.head.ref;
            const body = pr.body || "";

            // Extraction du numéro de ticket en début de nom de branche
            // Ajuste la regex si ton pattern de nommage est différent
            // (ex: "feature/42-xxx" -> ajouter un ^.*?\/ optionnel)
            const match = branch.match(/^(?:.*\/)?(\d+)-/);
            if (!match) {
              console.log(`Aucun numéro de ticket trouvé dans le nom de branche "${branch}".`);
              return;
            }

            const issueNumber = match[1];
            const newBody = `Closes #${issueNumber}\n\n${body}`;

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              body: newBody,
            });

            console.log(`Ajout de "Closes #${issueNumber}" à la PR #${pr.number}.`);
