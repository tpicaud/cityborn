name: Prod - Continuous Deployment

on:
  workflow_dispatch:
      inputs:
        release_type: 
          description: 'Type of release to create'
          required: true
          default: 'patch'
          type: choice
          options:
            - patch
            - minor
            - major

jobs:
  get-tag:
    name: Get tags
    runs-on: ubuntu-latest
    outputs:
      lastProdTag: ${{ steps.get_tag.outputs.lastProdTag }}
      newReleaseTag: ${{ steps.get_tag.outputs.newReleaseTag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get tags
        id: get_tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST_PROD=$(gh release list --repo ${{ github.repository }} --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName')
          NEW_RELEASE=$(git describe --tags --abbrev=0 --match "v[0-9]*" --exclude "*-rc")
          echo "lastProdTag=$LAST_PROD" >> $GITHUB_OUTPUT
          echo "newReleaseTag=$NEW_RELEASE" >> $GITHUB_OUTPUT

  detect-changes:
    name: Detect changes
    needs:
      - get-tag
    uses: ./.github/workflows/detect-changes.yml
    with:
      base: ${{ needs.get-tag.outputs.lastProdTag }}

  bump-version:
    name: Bump Version
    runs-on: ubuntu-latest
    needs:
      - detect-changes
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Bump Expo version
        id: version
        run: |
          node <<'EOF'
          const fs = require('fs');

          const releaseType = '${{ inputs.release_type }}';

          const filePath = 'apps/mobile/app.config.js';
          const content = fs.readFileSync(filePath, 'utf8');

          const match = content.match(/version:\s*['"](\d+)\.(\d+)\.(\d+)['"]/);

          if (!match) {
            throw new Error('Version not found in app.config.js');
          }

          let [, major, minor, patch] = match;

          major = Number(major);
          minor = Number(minor);
          patch = Number(patch);

          switch (releaseType) {
            case 'major':
              major++;
              minor = 0;
              patch = 0;
              break;

            case 'minor':
              minor++;
              patch = 0;
              break;

            case 'patch':
            default:
              patch++;
              break;
          }

          const newVersion = `${major}.${minor}.${patch}`;

          const updated = content.replace(
            /version:\s*['"](\d+)\.(\d+)\.(\d+)['"]/,
            `version: '${newVersion}'`
          );

          fs.writeFileSync(filePath, updated);

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `version=${newVersion}\n`
          );

          console.log(`Updated version to ${newVersion}`);
          EOF

      - name: Commit version bump
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .
          git commit -m "chore: release v${{ steps.version.outputs.version }}"

      - name: Push changes
        run: |
          git push origin HEAD
  build-and-deploy-prod:
    name: Build + Deploy - Prod
    needs:
      - detect-changes
      - bump-version
    secrets: inherit
    uses: ./.github/workflows/build-and-deploy-prod.yml
    with:
      backendHasChanged: ${{ needs.detect-changes.outputs.backendHasChanged }}
      frontendHasChanged: ${{ needs.detect-changes.outputs.frontendHasChanged }}
      backofficeHasChanged: ${{ needs.detect-changes.outputs.backofficeHasChanged }}
      mobileHasChanged: ${{ needs.detect-changes.outputs.mobileHasChanged }}

  create-release:
    name: Release
    needs:
      - get-tag
      - build-and-deploy-prod
    permissions:
      contents: write
    uses: ./.github/workflows/generate-release.yml
    with:
      releaseTag: ${{ needs.get-tag.outputs.newReleaseTag }}
      prerelease: false