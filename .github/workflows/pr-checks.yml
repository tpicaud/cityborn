name: PR Checks

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  verify:
    name: Verify
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
      TURBO_SCM_HEAD: ${{ github.event.pull_request.head.sha }}
      NEXT_PUBLIC_GOOGLE_MAP_API_KEY: dummy-key
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: dummy-key
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: dummy-client-id
      NEXT_PUBLIC_WEB_APP_URL: https://cityborn.example.com
      NEXT_PUBLIC_REST_BACKEND_URL: https://api.example.com
      NEXT_PUBLIC_WEBSOCKET_BACKEND_URL: wss://ws.example.com
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install pnpm
        run: npm install -g pnpm@10.33.2

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify

  mobile-prebuild:
    name: Mobile prebuild
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      APP_VARIANT: development
      GOOGLE_MAPS_ANDROID_API_KEY: dummy-key
      GOOGLE_MAPS_IOS_API_KEY: dummy-key
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install

      - name: Prebuild mobile app
        working-directory: apps/mobile
        run: pnpm prebuild
