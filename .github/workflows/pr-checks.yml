name: PR Checks

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  detect-changes:
    name: Detect changes
    uses: ./.github/workflows/detect-changes.yml

  agent-docs:
    name: Agent instructions
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Check agent instructions
        run: pnpm check:agent-docs

  axiom-dashboards:
    name: Axiom dashboards
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install

      - name: Check Axiom dashboards
        run: pnpm check:axiom-dashboards

  typecheck:
    name: Typecheck
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm typecheck

  biome:
    name: Biome
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install

      - name: Check formatting and lint rules
        run: pnpm lint

  api-compat:
    name: API compatibility
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install

      - name: Check HTTP and WebSocket compatibility
        run: pnpm check:api-compat

  mobile-prebuild:
    name: Mobile prebuild
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      APP_VARIANT: development
      GOOGLE_MAPS_ANDROID_API_KEY: dummy-key
      GOOGLE_MAPS_IOS_API_KEY: dummy-key
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install

      - name: Prebuild mobile app
        working-directory: apps/mobile
        run: pnpm prebuild

  frontend-static-build:
    name: Frontend static build
    needs: detect-changes
    if: github.event.pull_request.draft == false && needs.detect-changes.outputs.frontendHasChanged == 'true'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_GOOGLE_MAP_API_KEY: dummy-key
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: dummy-client-id
      NEXT_PUBLIC_REST_BACKEND_URL: https://api.example.com
      NEXT_PUBLIC_WEBSOCKET_BACKEND_URL: wss://ws.example.com
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install

      - name: Build static frontend
        run: pnpm frontend:build

  back-office-static-build:
    name: Back-office static build
    needs: detect-changes
    if: github.event.pull_request.draft == false && needs.detect-changes.outputs.backofficeHasChanged == 'true'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: dummy-key
      NEXT_PUBLIC_REST_BACKEND_URL: https://api.example.com
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install

      - name: Build static back-office
        run: pnpm build:back-office

  test-selection:
    name: Select affected test suites
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Install pnpm
        run: npm install -g pnpm@10.33.2
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Plan affected tests
        id: plan
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
          TURBO_SCM_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pnpm exec turbo run test --affected --dry=json > test-plan.json
          packages=$(jq -c '[.tasks[] | select(.task == "test" and .command != "<NONEXISTENT>") | .package] | unique' test-plan.json)
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  package-tests:
    name: Tests (${{ matrix.package }})
    needs: test-selection
    if: github.event.pull_request.draft == false && needs.test-selection.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.test-selection.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Install pnpm
        run: npm install -g pnpm@10.33.2
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run package tests
        env:
          TEST_PACKAGE: ${{ matrix.package }}
        run: pnpm exec turbo run test --filter="$TEST_PACKAGE"

  backend-integration:
    name: Backend integration tests
    needs: test-selection
    if: github.event.pull_request.draft == false && contains(fromJSON(needs.test-selection.outputs.packages), 'cityborn-backend')
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://cityborn_test:cityborn_test@localhost:5433/cityborn_test
      DIRECT_URL: postgresql://cityborn_test:cityborn_test@localhost:5433/cityborn_test
      REDIS_URL: redis://localhost:6380/0
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: cityborn_test
          POSTGRES_PASSWORD: cityborn_test
          POSTGRES_DB: cityborn_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U cityborn_test -d cityborn_test"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:8-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install

      - name: Run backend integration tests
        run: pnpm --dir apps/backend test:int

  backend-e2e:
    name: Backend e2e tests
    needs: test-selection
    if: github.event.pull_request.draft == false && contains(fromJSON(needs.test-selection.outputs.packages), 'cityborn-backend')
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://cityborn_test:cityborn_test@localhost:5433/cityborn_test
      DIRECT_URL: postgresql://cityborn_test:cityborn_test@localhost:5433/cityborn_test
      REDIS_URL: redis://localhost:6380/0
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: cityborn_test
          POSTGRES_PASSWORD: cityborn_test
          POSTGRES_DB: cityborn_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U cityborn_test -d cityborn_test"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:8-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install

      - name: Run backend e2e tests
        run: pnpm --dir apps/backend test:e2e
