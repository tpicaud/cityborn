name: Deploy Production Backend on Fly.io

on:
  push:
    branches:
      - master
    paths:
      - 'apps/backend/**'
      - 'packages/types/**'
      - 'package/errors/**'
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Fly.io
        uses: superfly/flyctl-actions/setup-flyctl@master
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Build Docker image
        run: |
          TAG=cityborn-backend:v$(date +%Y%m%d)-${GITHUB_SHA::7}
          echo "Docker image tag: $TAG"
          docker build -f ./apps/backend/Dockerfile -t $TAG .
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Tag docker image
        run: |
          FLYIO_TAG=registry.fly.io/${{ env.TAG }}
          echo "FLYIO_TAG=$FLYIO_TAG" >> $GITHUB_ENV
          docker tag $TAG $FLYIO_TAG

      - name: Push Docker image to Fly.io Registry
        run: |
          flyctl auth docker
          docker push $FLYIO_TAG
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy Fly.io using pushed image
        run: |
          flyctl deploy --image $FLYIO_TAG --config ./apps/backend/fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
