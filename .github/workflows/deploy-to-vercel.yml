name: Deploy to Vercel

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - staging
          - production
      project_id:
        description: 'Vercel Project ID'
        required: true
        type: string
  workflow_call:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: string
      project_id:
        description: 'Vercel Project ID'
        required: true
        type: string
    secrets:
      VERCEL_TOKEN:
        required: true
      VERCEL_TEAM_ID:
        required: true

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
      VERCEL_PROJECT_ID: ${{ inputs.project_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Set environment variables
        run: |
          case "${{ inputs.environment }}" in
            production)
              echo "VERCEL_ENV=production" >> $GITHUB_ENV
              echo "VERCEL_PROD_FLAG=--prod" >> $GITHUB_ENV
              ;;
            staging)
              echo "VERCEL_ENV=preview" >> $GITHUB_ENV
              echo "VERCEL_PROD_FLAG=" >> $GITHUB_ENV
              ;;
            *)
              echo "Unknown environment: ${{ inputs.environment }}"
              exit 1
              ;;
          esac

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=${{ env.VERCEL_ENV }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project
        run: vercel build ${{ env.VERCEL_PROD_FLAG }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: |
          DEPLOY_URL=$(vercel deploy ${{ env.VERCEL_PROD_FLAG }} --prebuilt --token=${{ secrets.VERCEL_TOKEN }} --yes 2>/dev/null | tail -1)
          echo "DEPLOY_URL=$DEPLOY_URL" >> $GITHUB_ENV
          echo "Deployed to: $DEPLOY_URL"

      - name: Set custom domain alias
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            vercel alias set "$DEPLOY_URL" cityborn.app --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel alias set "$DEPLOY_URL" staging.cityborn.app --token=${{ secrets.VERCEL_TOKEN }}
          fi