name: Build iOS App

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to build"
        required: true
        type: choice
        options:
          - development
          - staging
          - production
      profile:
        description: "EAS profile to use"
        required: true
        type: choice
        options:
          - development
          - staging
          - production
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      profile:
        required: true
        type: string
    outputs:
      ipa_artifact_name:
        value: ${{ jobs.build.outputs.ipa_artifact_name }}
      install_url:
        value: ${{ jobs.build.outputs.install_url }}
    secrets:
      EXPO_TOKEN:
        required: true
      GOOGLE_MAPS_ANDROID_API_KEY:
        required: true
      GOOGLE_MAPS_IOS_API_KEY:
        required: true

jobs:
  build:
    name: Build app
    runs-on: macos-26
    environment: ${{ inputs.environment }}
    env:
      APP_VARIANT: ${{ vars.APP_VARIANT }}
      APP_ID: ${{ vars.APP_ID }}
      GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
      GOOGLE_MAPS_IOS_API_KEY: ${{ secrets.GOOGLE_MAPS_IOS_API_KEY }}
      EXPO_PUBLIC_REST_BACKEND_URL: ${{ vars.EXPO_PUBLIC_REST_BACKEND_URL }}
      EXPO_PUBLIC_WEBSOCKET_BACKEND_URL: ${{ vars.EXPO_PUBLIC_WEBSOCKET_BACKEND_URL }}
      EXPO_PUBLIC_GOOGLE_OAUTH_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_OAUTH_WEB_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_OAUTH_IOS_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_OAUTH_IOS_CLIENT_ID }}
    outputs:
      ipa_artifact_name: ${{ steps.ipa.outputs.ipa_name }}
      install_url: ${{ steps.eas_upload.outputs.install_url }}

    steps:
      - name: Setup repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install

      - name: Check environment variables
        if: inputs.profile != 'development'
        working-directory: apps/mobile
        run: pnpm check-env

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Syncing app version code
        working-directory: apps/mobile
        run: eas build:version:sync --platform ios --profile ${{ inputs.profile }}

      - name: Compute IPA name
        id: ipa
        working-directory: apps/mobile
        run: |
          VERSION=$(npx expo config --json | jq -r '.version')
          VERSION_CODE=$(eas build:version:get -p ios --json --non-interactive --profile production | jq -r '.buildNumber')

          IPA_NAME=cityborn_v${VERSION}+${VERSION_CODE}_${{ inputs.profile }}.ipa
          IPA_PATH=${{ github.workspace }}/${IPA_NAME}

          echo "ipa_name=$IPA_NAME" >> $GITHUB_OUTPUT
          echo "ipa_path=$IPA_PATH" >> $GITHUB_OUTPUT

          echo "Computed IPA name: $IPA_NAME"

      - name: Build iOS app
        working-directory: apps/mobile
        run: |
          REFRESH_AD_HOC_FLAG=""
          if [ "${{ inputs.profile }}" != "production" ]; then
            REFRESH_AD_HOC_FLAG="--refresh-ad-hoc-provisioning-profile"
          fi

          eas build --platform ios --profile ${{ inputs.profile }} --local --non-interactive $REFRESH_AD_HOC_FLAG --output ${{ steps.ipa.outputs.ipa_path }}

      - name: Upload build to EAS
        id: eas_upload
        if: inputs.profile != 'production'
        working-directory: apps/mobile
        run: |
          UPLOAD_JSON=$(eas upload --platform ios --build-path ${{ steps.ipa.outputs.ipa_path }} --non-interactive --json)
          INSTALL_URL=$(echo "$UPLOAD_JSON" | jq -er '.url')

          echo "install_url=$INSTALL_URL" >> $GITHUB_OUTPUT
          echo "### 📲 [Installer ${{ steps.ipa.outputs.ipa_name }}]($INSTALL_URL)" >> $GITHUB_STEP_SUMMARY

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ipa.outputs.ipa_name }}
          path: ${{ steps.ipa.outputs.ipa_path }}
          retention-days: 14
