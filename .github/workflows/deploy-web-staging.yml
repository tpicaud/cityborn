name: Deploy - Web - Staging

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  get-tags:
    name: Get last prod tags
    runs-on: ubuntu-latest
    outputs:
      lastWebTag: ${{ steps.tags.outputs.lastWebTag }}
      lastMobileTag: ${{ steps.tags.outputs.lastMobileTag }}
    steps:
      - name: Get last prod tags
        id: tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST_WEB=$(gh release list --repo ${{ github.repository }} \
            --exclude-pre-releases --limit 10 --json tagName \
            --jq '[.[] | select(.tagName | startswith("web-v"))] | .[0].tagName // ""')
          LAST_MOBILE=$(gh release list --repo ${{ github.repository }} \
            --exclude-pre-releases --limit 10 --json tagName \
            --jq '[.[] | select(.tagName | startswith("mobile-v"))] | .[0].tagName // ""')
          echo "lastWebTag=$LAST_WEB" >> $GITHUB_OUTPUT
          echo "lastMobileTag=$LAST_MOBILE" >> $GITHUB_OUTPUT

  create-web-pre-release:
    name: Pre-release Web
    needs: [get-tags]
    permissions:
      contents: write
    uses: ./.github/workflows/generate-release.yml
    with:
      releaseTag: web-pre-release
      previousTag: ${{ needs.get-tags.outputs.lastWebTag }}
      filterPaths: apps/backend, apps/frontend, apps/back-office, packages
      prerelease: true

  create-mobile-pre-release:
    name: Pre-release Mobile
    needs: [get-tags]
    permissions:
      contents: write
    uses: ./.github/workflows/generate-release.yml
    with:
      releaseTag: mobile-pre-release
      previousTag: ${{ needs.get-tags.outputs.lastMobileTag }}
      filterPaths: apps/mobile, packages
      prerelease: true

  notify-discord:
    name: Notify Discord (PR merged)
    needs: [create-web-pre-release, create-mobile-pre-release]
    runs-on: ubuntu-latest
    steps:
      - name: Detect merged PR and notify Discord
        uses: actions/github-script@v8
        env:
          DISCORD_WEBHOOK_URL_STAGING_NOTIF: ${{ secrets.DISCORD_WEBHOOK_URL_STAGING_NOTIF }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');

            const { data: associatedPrs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner, repo, commit_sha: context.sha,
            });
            const mergedPrs = associatedPrs.filter(pr => pr.merged_at && pr.base.ref === 'main');

            if (mergedPrs.length === 0) {
              console.log('No merged PR associated with this push — direct push to main, skipping notification.');
              return;
            }

            const webhookUrl = process.env.DISCORD_WEBHOOK_URL_STAGING_NOTIF;
            if (!webhookUrl) {
              console.log('DISCORD_WEBHOOK_URL_STAGING_NOTIF is not set, skipping notification.');
              return;
            }

            const platforms = [
              { name: 'Web', paths: ['apps/backend', 'apps/frontend', 'apps/back-office', 'packages'], releaseTag: 'web-pre-release', color: 0x5865f2, emoji: '🟦' },
              { name: 'Mobile', paths: ['apps/mobile', 'packages'], releaseTag: 'mobile-pre-release', color: 0x57f287, emoji: '🟩' },
            ];
            const BOTH_PLATFORMS_COLOR = 0xeb459e;

            for (const pr of mergedPrs) {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner, repo, pull_number: pr.number, per_page: 100,
              });
              const filenames = files.map(f => f.filename);

              const matchedPlatforms = platforms.filter(platform =>
                filenames.some(f => platform.paths.some(p => f.startsWith(p)))
              );
              if (matchedPlatforms.length === 0) continue;

              const color = matchedPlatforms.length === platforms.length
                ? BOTH_PLATFORMS_COLOR
                : matchedPlatforms[0].color;

              await fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  embeds: [{
                    title: `${pr.title} (#${pr.number})`,
                    url: pr.html_url,
                    description: matchedPlatforms
                      .map(p => `${p.emoji} **${p.name}** — [pre-release](https://github.com/${owner}/${repo}/releases/tag/${p.releaseTag})`)
                      .join('\n'),
                    color,
                    author: { name: pr.user.login, icon_url: pr.user.avatar_url },
                  }],
                }),
              });
            }

  detect-changes:
    name: Detect changes
    uses: ./.github/workflows/detect-changes.yml

  version-openapi-draft:
    name: Version OpenAPI draft
    needs:
      - detect-changes
    if: needs.detect-changes.outputs.backendHasChanged == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: version-api-on-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GH_PAT }}

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install

      - name: Generate OpenAPI draft
        id: generate
        run: pnpm --dir packages/api generate:openapi:draft

      - name: Commit versioned draft
        if: steps.generate.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add packages/api/openapi/
          git commit -m "chore(api): version openapi draft ${{ steps.generate.outputs.filename }} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

  build-and-deploy-web-staging:
    name: Build + Deploy - Web - Staging
    needs:
      - detect-changes
      - version-openapi-draft
    if: ${{ !failure() && !cancelled() }}
    secrets: inherit
    uses: ./.github/workflows/_build-deploy-web-staging.yml
    with:
      backendHasChanged: ${{ needs.detect-changes.outputs.backendHasChanged }}
      frontendHasChanged: ${{ needs.detect-changes.outputs.frontendHasChanged }}
      backofficeHasChanged: ${{ needs.detect-changes.outputs.backofficeHasChanged }}
