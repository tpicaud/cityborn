name: Release - Web - Prod

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Type of release to create"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  get-tag:
    name: Get tags
    runs-on: ubuntu-latest
    outputs:
      lastProdTag: ${{ steps.get_tag.outputs.lastProdTag }}
      newReleaseTag: ${{ steps.get_tag.outputs.newReleaseTag }}
    steps:
      - name: Get tags
        id: get_tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST_PROD=$(gh release list --repo ${{ github.repository }} \
            --exclude-pre-releases --limit 10 --json tagName \
            --jq '[.[] | select(.tagName | startswith("web-v"))] | .[0].tagName // ""')

          VERSION=${LAST_PROD#web-v}
          IFS='.' read -r major minor patch <<< "${VERSION:-0.0.0}"
          case "${{ inputs.release_type }}" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            *)     patch=$((patch+1)) ;;
          esac

          echo "lastProdTag=${LAST_PROD}" >> $GITHUB_OUTPUT
          echo "newReleaseTag=web-v${major}.${minor}.${patch}" >> $GITHUB_OUTPUT

  detect-changes:
    name: Detect changes
    needs:
      - get-tag
    uses: ./.github/workflows/detect-changes.yml
    with:
      base: ${{ needs.get-tag.outputs.lastProdTag }}

  version-openapi-release:
    name: Version OpenAPI release
    needs:
      - detect-changes
    if: needs.detect-changes.outputs.backendHasChanged == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: version-api-on-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GH_PAT }}

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install

      - name: Release OpenAPI version
        id: generate
        run: pnpm --dir packages/api generate:openapi:release

      - name: Commit versioned release
        if: steps.generate.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add packages/api/openapi/
          git commit -m "chore(api): version openapi release ${{ steps.generate.outputs.filename }} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

  build-and-deploy-web-prod:
    name: Build + Deploy - Web - Prod
    needs:
      - detect-changes
      - version-openapi-release
    if: ${{ !failure() && !cancelled() }}
    secrets: inherit
    uses: ./.github/workflows/_build-deploy-web-prod.yml
    with:
      backendHasChanged: ${{ needs.detect-changes.outputs.backendHasChanged }}
      frontendHasChanged: ${{ needs.detect-changes.outputs.frontendHasChanged }}
      backofficeHasChanged: ${{ needs.detect-changes.outputs.backofficeHasChanged }}

  create-release:
    name: Release
    needs:
      - get-tag
      - build-and-deploy-web-prod
    permissions:
      contents: write
    uses: ./.github/workflows/generate-release.yml
    with:
      releaseTag: ${{ needs.get-tag.outputs.newReleaseTag }}
      previousTag: ${{ needs.get-tag.outputs.lastProdTag }}
      filterPaths: apps/backend, apps/frontend, apps/back-office, packages
      prereleaseTagToDelete: web-pre-release
      prerelease: false

  notify-discord:
    name: Notify Discord (Prod release)
    needs: [get-tag, create-release]
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord
        uses: actions/github-script@v8
        env:
          DISCORD_WEBHOOK_URL_PROD_NOTIF: ${{ secrets.DISCORD_WEBHOOK_URL_PROD_NOTIF }}
          PR_LIST: ${{ needs.create-release.outputs.prList }}
        with:
          script: |
            const webhookUrl = process.env.DISCORD_WEBHOOK_URL_PROD_NOTIF;
            if (!webhookUrl) {
              console.log('DISCORD_WEBHOOK_URL_PROD_NOTIF is not set, skipping notification.');
              return;
            }

            const prs = JSON.parse(process.env.PR_LIST);
            if (prs.length === 0) {
              console.log('No PR in this release, skipping notification.');
              return;
            }

            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            const releaseTag = '${{ needs.get-tag.outputs.newReleaseTag }}';

            await fetch(webhookUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                embeds: [{
                  title: `🟦 Web — ${releaseTag} déployé en production`,
                  url: `https://github.com/${owner}/${repo}/releases/tag/${releaseTag}`,
                  description: prs.map(pr => `- [${pr.title}](${pr.url}) (#${pr.number})`).join('\n'),
                  color: 0x5865f2,
                }],
              }),
            });
