min_days_supported: 30
min_num_of_version_supported: 3

# To retire a version early (before it ages out of this policy), add
# "deprecatedAt" + "deprecationReason" to its entry in
# versions/versions-manifest.json. This also retires every OLDER version
# automatically (deprecating vN raises the minimum supported version to
# vN+1) — mark the highest version you want to retire.
