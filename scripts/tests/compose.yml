services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: cityborn_test
      POSTGRES_PASSWORD: cityborn_test
      POSTGRES_DB: cityborn_test
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U cityborn_test -d cityborn_test"]
      interval: 1s
      timeout: 5s
      retries: 60
  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1::6379"
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 1s
      timeout: 5s
      retries: 60
