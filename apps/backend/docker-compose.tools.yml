name: cityborn-tools

services:
  adminer:
    image: adminer:latest
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  redisinsight:
    image: redis/redisinsight:latest
    environment:
      RI_ACCEPT_TERMS_AND_CONDITIONS: "true"
      RI_REDIS_HOST0: redis
      RI_REDIS_PORT0: 6379
      RI_REDIS_ALIAS0: local
    ports:
      - "127.0.0.1:5540:5540"
    restart: unless-stopped

networks:
  default:
    name: cityborn-slot-0_default
    external: true
