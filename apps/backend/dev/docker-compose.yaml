services:
  cityborn_db:
    image: postgres:latest
    container_name: cityborn_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: cityborn_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  cityborn_pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cityborn_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      - cityborn_db

volumes:
  pgdata:
