# fly.toml app configuration file generated for cityborn-backend on 2025-04-08T17:20:10+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cityborn-backend'
primary_region = 'cdg'

[build]

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 2
  processes = ['app']

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"