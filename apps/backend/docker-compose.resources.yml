name: ${COMPOSE_PROJECT_NAME:?absent de apps/backend/.env, lancer scripts/setup-worktree.sh dans un worktree}

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cityborn_dev
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    configs:
      - source: test-database
        target: /docker-entrypoint-initdb.d/20_test_database.sql
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 1s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 1s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis-test:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:${REDIS_TEST_PORT:-6380}:6379"
    volumes:
      - redis-test-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 1s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  adminer:
    image: adminer:latest
    profiles: [tools]
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - postgres
    restart: unless-stopped

  redisinsight:
    image: redis/redisinsight:latest
    profiles: [tools]
    environment:
      RI_ACCEPT_TERMS_AND_CONDITIONS: "true"
      RI_REDIS_HOST0: redis
      RI_REDIS_PORT0: 6379
      RI_REDIS_ALIAS0: local
    ports:
      - "127.0.0.1:5540:5540"
    depends_on:
      - redis
    restart: unless-stopped

configs:
  test-database:
    content: |
      CREATE ROLE cityborn_test LOGIN PASSWORD 'cityborn_test';
      CREATE DATABASE cityborn_test OWNER cityborn_test TEMPLATE template_postgis;

volumes:
  postgres-data:
  redis-data:
  redis-test-data:
