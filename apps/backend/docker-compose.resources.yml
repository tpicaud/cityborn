x-checkout-labels: &checkout-labels
  cityborn.checkout: ${CITYBORN_CHECKOUT:-}
  cityborn.host: ${CITYBORN_HOST:-}
  cityborn.slot: ${CITYBORN_SLOT:-0}

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cityborn_dev
    labels: *checkout-labels
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    configs:
      - source: test-database
        target: /docker-entrypoint-initdb.d/20_test_database.sql
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 1s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    labels: *checkout-labels
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 1s
      timeout: 5s
      retries: 30
    restart: unless-stopped

configs:
  test-database:
    content: |
      CREATE ROLE cityborn_test LOGIN PASSWORD 'cityborn_test';
      CREATE DATABASE cityborn_test OWNER cityborn_test TEMPLATE template_postgis;

volumes:
  postgres-data:
  redis-data:
