name: cityborn_resources

services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: postgis
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./docker-data:/var/lib/postgresql/data
    networks:
      - pg_network
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: adminer
    ports:
      - "8080:8080"
    networks:
      - pg_network
    restart: unless-stopped
    depends_on:
      - postgis

  redis:
    image: redis:8-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data
    networks:
      - pg_network
    restart: unless-stopped

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    environment:
      RI_ACCEPT_TERMS_AND_CONDITIONS: "true"
      RI_REDIS_HOST0: redis
      RI_REDIS_PORT0: 6379
      RI_REDIS_ALIAS0: local
    ports:
      - "5540:5540"
    networks:
      - pg_network
    depends_on:
      - redis
    restart: unless-stopped

  postgis-test:
    image: postgis/postgis:16-3.4
    profiles: [test]
    environment:
      POSTGRES_USER: cityborn_test
      POSTGRES_PASSWORD: cityborn_test
      POSTGRES_DB: cityborn_test
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U cityborn_test -d cityborn_test"]
      interval: 1s
      timeout: 5s
      retries: 30

  redis-test:
    image: redis:8-alpine
    profiles: [test]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis-test-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 1s
      timeout: 5s
      retries: 30

volumes:
  postgres-test-data:
  redis-test-data:

networks:
  pg_network:
