name: cityborn_resources

x-postgis: &postgis
  image: postgis/postgis:16-3.4
  healthcheck:
    test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB']
    interval: 1s
    timeout: 5s
    retries: 30

x-redis: &redis
  image: redis:8-alpine
  healthcheck:
    test: [CMD, redis-cli, ping]
    interval: 1s
    timeout: 5s
    retries: 30

services:
  postgis:
    <<: *postgis
    container_name: postgis
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./docker-data:/var/lib/postgresql/data
    networks:
      - pg_network
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: adminer
    ports:
      - "8080:8080"
    networks:
      - pg_network
    restart: unless-stopped
    depends_on:
      - postgis

  redis:
    <<: *redis
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data
    networks:
      - pg_network
    restart: unless-stopped

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    environment:
      RI_ACCEPT_TERMS_AND_CONDITIONS: "true"
      RI_REDIS_HOST0: redis
      RI_REDIS_PORT0: 6379
      RI_REDIS_ALIAS0: local
    ports:
      - "5540:5540"
    networks:
      - pg_network
    depends_on:
      - redis
    restart: unless-stopped

  postgis-test:
    <<: *postgis
    profiles: [test]
    environment:
      POSTGRES_USER: cityborn_test
      POSTGRES_PASSWORD: cityborn_test
      POSTGRES_DB: cityborn_test
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql/data

  redis-test:
    <<: *redis
    profiles: [test]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis-test-data:/data

  postgis-recette:
    <<: *postgis
    profiles: [recette]
    environment:
      POSTGRES_USER: cityborn_recette
      POSTGRES_PASSWORD: cityborn_recette
      POSTGRES_DB: cityborn_recette
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres-recette-data:/var/lib/postgresql/data

  redis-recette:
    <<: *redis
    profiles: [recette]
    ports:
      - "127.0.0.1:6381:6379"
    volumes:
      - redis-recette-data:/data

volumes:
  postgres-test-data:
  redis-test-data:
  postgres-recette-data:
  redis-recette-data:

networks:
  pg_network:
